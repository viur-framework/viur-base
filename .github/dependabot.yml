version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/sources/app"
      - "/sources/site"
    schedule:
      interval: "weekly"
    groups:
      npm:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
