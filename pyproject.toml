[project]
# valid package-name placeholder (uv rejects "{{app_id}}", and normalizes names to lowercase/hyphens in uv.lock,
# so the token must be lowercase-hyphen to match in both files); clean-base.py replaces it with the real app_id
name = "viur-base-appid"
version = "3.0.0"
description = "{{app_id}} Website"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "viur-core[mailjet]~=3.8.0",
    "viur-toolkit~=0.8",
]

[dependency-groups]
dev = [
    "viur-cli~=3.0",
]

[tool.uv.sources]
# viur-cli = { path = "../viur-cli", editable = true }
# viur-core = { path = "../viur-core", editable = true }
