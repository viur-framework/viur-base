# clone main repository and all private submodules:
# https://source.cloud.google.com/
#
# create a trigger for main repository
# https://console.cloud.google.com/cloud-build/triggers/add
# add name (BuildDeploy) and description (Build & Deploy)

# activate App Engine Admin API
# https://console.developers.google.com/apis/api/appengine.googleapis.com/overview
#
# allow App Engine Deployment
# https://console.cloud.google.com/cloud-build/settings

# Make sure the project's Cloud Build service account has permission to download from

# Submodules
# Cloud Build has no SSH key, so the clone step rewrites GitHub SSH URLs to HTTPS (works for public repos).
# For private repos on other hosts, rewrite them the same way with a token from Secret Manager, e.g.:
#     git config --global url."https://<user>:$${TOKEN}@<host>/".insteadOf "git@<host>:"

steps:
  # clone source code
  # if you need to reconfigure submodules to use https or git, do this here
  - name: "gcr.io/cloud-builders/git"
    entrypoint: bash
    args:
      - "-c"
      - |
        # public GitHub submodules: SSH → HTTPS
        git config --global --add url."https://github.com/".insteadOf "git@github.com:"
        git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
        git submodule update --init --recursive

  # buildTasks: run the release build in the viur-build container — a Debian build image with a fixed Python toolchain for viur-cli
  - name: "europe-west3-docker.pkg.dev/viur-build/viur-build-debian/viur-build:containerbuild-v0.14n24"
    entrypoint: bash
    args:
      - "-c"
      - |
        uv sync
        uv run viur build release

  # deploy: use Google's own gcloud container to deploy our build
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "app"
      - "deploy"
      - "./deploy/app.yaml"
      - "--project=$PROJECT_ID"
      - "--version=gcb-$SHORT_SHA-$_TAG_NAME"
      - "--no-promote"

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 6000s
